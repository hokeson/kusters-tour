(function(){function addNav(){const n=document.getElementById('nav');if(n&&!n.querySelector('[href="#/headcovery"]'))n.insertAdjacentHTML('beforeend','<a href="#/headcovery">Headcovery</a>');}async function show(){if(location.hash.replace(/^#\/?/,'').split('/')[0]!=='headcovery')return;addNav();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/headcovery'));document.body.classList.remove('wide');document.body.style.setProperty('--bg','#efd6c2');const a=document.getElementById('app');try{a.innerHTML=await window.KunstersHeadcovers.page();}catch(e){a.innerHTML='<p>Headcovery se nepodařilo načíst. ('+String(e.message||e)+')</p>';}window.scrollTo(0,0);}addNav();window.addEventListener('hashchange',()=>setTimeout(show,0));if(location.hash.startsWith('#/headcovery'))setTimeout(show,0);new MutationObserver(addNav).observe(document.getElementById('nav'),{childList:true});})();
